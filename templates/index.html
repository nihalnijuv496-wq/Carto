<h1>Carto</h1>
<form method="post" action="/generate">
  <input name="name" placeholder="Map name">
  <input name="width" type="number" value="1000" min="200" max="1000">
  <input name="height" type="number" value="1000" min="200" max="1000">
  <input name="count" type="number" value="6" min="1" max="30">
  <button>Generate</button>
</form>
<ul>
{% for m in maps %}
  <li><a href="/map/{{ m['id'] }}">{{ m['name'] }}</a> (seed {{ m['seed'] }})</li>
{% endfor %}
</ul>
